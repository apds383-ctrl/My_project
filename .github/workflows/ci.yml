name: FastAPI CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем репозиторий (только один раз!)
      - name: Download repository
        uses: actions/checkout@v4

      # 2. Настраиваем Python (обязательно, иначе python не будет найден)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Запускаем тесты
      - name: Run tests
        run: python -m pytest -v

      # 5. Загружаем артефакты (результат сборки)
      - name: Upload tested application
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-service
          path: |
            app_final.py
            requirements.txt
            README.md
          retention-days: 7